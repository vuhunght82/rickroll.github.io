<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 95 Desktop</title>
  <style>
    /* Reset & Font hệ thống chuẩn Windows 95 */
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #008080; /* Màu nền Desktop mặc định của Win95 */
      font-family: "MS Sans Serif", Tahoma, sans-serif;
      font-size: 11px;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Hiệu ứng viền 3D cổ điển */
    .win-bevel-out {
      border-top: 1.5px solid #ffffff;
      border-left: 1.5px solid #ffffff;
      border-right: 1.5px solid #000000;
      border-bottom: 1.5px solid #000000;
      box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080;
    }

    .win-bevel-in {
      border-top: 1.5px solid #808080;
      border-left: 1.5px solid #808080;
      border-right: 1.5px solid #ffffff;
      border-bottom: 1.5px solid #ffffff;
      box-shadow: inset 1px 1px 0 #000000, inset -1px -1px 0 #dfdfdf;
    }

    /* Desktop Icons */
    .desktop {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 80px;
    }

    .icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: white;
      cursor: pointer;
    }

    .icon-img {
      width: 32px;
      height: 32px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .icon-label {
      padding: 1px 3px;
    }

    .icon:active .icon-label, .icon.selected .icon-label {
      background-color: #000080;
    }

    /* Taskbar */
    .taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 28px;
      background: #c0c0c0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 3px;
      z-index: 1000;
    }

    .start-button {
      height: 22px;
      background: #c0c0c0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-button:active, .start-button.active {
      border-top: 1.5px solid #000000;
      border-left: 1.5px solid #000000;
      border-right: 1.5px solid #ffffff;
      border-bottom: 1.5px solid #ffffff;
      box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #dfdfdf;
    }
