<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bất ngờ chưa!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', Impact, sans-serif;
            cursor: pointer;
            user-select: none;
        }

        /* Lớp phủ hiệu ứng vỡ màn hình */
        .crack-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            pointer-events: none; /* Không cản trở click tiếp theo */
            z-index: 10;
            opacity: 0;
            transform: scale(1.2);
            transition: transform 0.1s ease-out, opacity 0.05s ease-out;
        }

        /* Khi bị đấm (kích hoạt bằng JS) */
        .cracked .crack-overlay {
            opacity: 1;
            transform: scale(1);
            /* Sử dụng ảnh kính vỡ dạng trong suốt nền PNG */
            background-image: url('https://pikbest.com');
        }

        /* Hiệu ứng rung lắc toàn màn hình khi đấm */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shake {
            animation: shake 0.3s;
            animation-iteration-count: 1;
        }

        /* Cấu trúc chữ hiển thị sau khi đấm */
        h1 {
            color: #FF0000;
            font-size: 8vw;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 5px 5px 0px #FFFFFF;
            margin: 0;
            padding: 20px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }

        /* Hiện chữ zoom to lên */
        .cracked h1 {
            opacity: 1;
            transform: scale(1);
        }
        
        /* Dòng chữ hướng dẫn ban đầu - bây giờ là nút vuông */
        .instruction {
            color: #fff;
            font-size: 24px;
            position: absolute;
            transition: opacity 0.2s, transform 0.08s;
            background: rgba(255,255,255,0.04);
            border: 3px solid #fff;
            padding: 14px 28px;
            border-radius: 0; /* Vuông */
            cursor: pointer;
            user-select: none;
            left: 50%;
            top: 70%;
            transform: translateX(-50%);
            z-index: 6;
            pointer-events: auto;
        }
        .instruction:active {
            transform: translateX(-50%) scale(0.98);
        }
        .cracked .instruction {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <button class="instruction">BẤM VÀO MÀN HÌNH ĐỂ XEM</button>
    <div class="crack-overlay"></div>
    <h1>BẠN BỊ LỪA RỒI!</h1>

    <script>
        document.body.addEventListener('click', function() {
            // Nếu đã vỡ rồi thì không chạy lại nữa
            if (this.classList.contains('cracked')) return;

            // Thêm hiệu ứng rung và hiệu ứng vỡ
            this.classList.add('shake', 'cracked');

            // Thêm âm thanh đấm/vỡ kính (tùy chọn)
            let audio = new Audio('https://soundjay.com');
            audio.play().catch(e => console.log("Cần tương tác trước để phát âm thanh"));

            // Xóa lớp rung sau khi hoàn thành animation để tránh lỗi giao diện
            setTimeout(() => {
                document.body.classList.remove('shake');
            }, 300);
        });
    </script>

</body>
</html>
