<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 95</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #008080; /* Màu nền Desktop cổ điển */
      font-family: "MS Sans Serif", Arial, sans-serif;
      font-size: 11px;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Hiệu ứng viền nổi 3D Windows 95 */
    .win-bevel-out {
      border: 2px solid;
      border-color: #ffffff #000000 #000000 #ffffff;
      box-shadow: inset 1px 1px 0px #dfdfdf, inset -1px -1px 0px #808080;
    }

    /* Hiệu ứng viền chìm 3D */
    .win-bevel-in {
      border: 2px solid;
      border-color: #808080 #ffffff #ffffff #808080;
      box-shadow: inset 1px 1px 0px #000000, inset -1px -1px 0px #dfdfdf;
    }

    /* Desktop Icons */
    .desktop {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 80px;
      height: calc(100vh - 28px);
    }

    .icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: white;
      cursor: pointer;
    }

    .icon-img {
      font-size: 30px;
      margin-bottom: 2px;
    }

    .icon-label {
      padding: 1px 4px;
      font-size: 11px;
    }

    .icon.selected .icon-label {
      background-color: #000080;
      color: #ffffff;
      outline: 1px dotted #ffff80;
    }

    /* Taskbar */
    .taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 28px;
      background: #c0c0c0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px;
      z-index: 10000;
    }

    .taskbar-left {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 100%;
    }

    .start-button {
      height: 22px;
      background: #c0c0c0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-button:active, .start-button.active, .taskbar-app-btn.active {
      border-color: #000000 #ffffff #ffffff #000000;
      box-shadow: inset 1px 1px 0px #808080, inset -1px -1px 0px #dfdfdf;
    }

    .taskbar-divider {
      width: 2px;
      height: 20px;
      border-left: 1px solid #808080;
      border-right: 1px solid #ffffff;
      margin: 0 2px;
    }

    .taskbar-app-btn {
      height: 22px;
      min-width: 120px;
      max-width: 160px;
      background: #c0c0c0;
      display: none;
      align-items: center;
      padding: 0 6px;
      font-size: 11px;
      gap: 6px;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .system-tray {
      height: 22px;
      padding: 2px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #c0c0c0;
    }

    /* Start Menu */
    .start-menu {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 0;
      width: 180px;
      background: #c0c0c0;
      z-index: 10001;
      padding: 2px;
    }

    .start-menu.open {
      display: flex;
    }

    .menu-sidebar {
      background: #808080;
      color: #c0c0c0;
      width: 24px;
      display: flex;
      align-items: flex-end;
      padding-bottom: 8px;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 2px;
    }

    .menu-sidebar span {
      color: #ffffff;
    }

    .menu-items {
      flex: 1;
      list-style: none;
    }

    .menu-item {
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .menu-item:hover {
      background-color: #000080;
      color: #ffffff;
    }

    .menu-separator {
      height: 1px;
      background: #808080;
      border-bottom: 1px solid #ffffff;
      margin: 3px 2px;
    }

    /* Cửa sổ Windows */
    .window {
      position: absolute;
      top: 50px;
      left: 100px;
      width: 380px;
      height: 260px;
      background: #c0c0c0;
      padding: 3px;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .window.maximized {
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: calc(100vh - 28px) !important;
    }

    .window.hidden {
      display: none !important;
    }

    .title-bar {
      background: #000080;
      color: #ffffff;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3px;
      font-weight: bold;
      cursor: move;
    }

    .title-bar-controls {
      display: flex;
      gap: 2px;
    }

    .win-btn {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      border: 1px solid;
      border-color: #ffffff #000000 #000000 #ffffff;
      font-size: 10px;
      font-weight: bold;
      line-height: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .win-btn:active {
      border-color: #000000 #ffffff #ffffff #000000;
    }

    .window-menu {
      display: flex;
      gap: 12px;
      padding: 2px 6px;
      font-size: 11px;
    }

    .window-body {
      flex: 1;
      background: #ffffff;
      margin-top: 2px;
      padding: 10px;
      overflow: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Desktop Icons -->
  <div class="desktop" id="desktop">
    <div class="icon" id="iconMyComputer" ondblclick="openApp('My Computer')">
      <div class="icon-img">💻</div>
      <div class="icon-label">My Computer</div>
    </div>
    <div class="icon" id="iconRecycleBin" ondblclick="openApp('Recycle Bin')">
      <div class="icon-img">🗑️</div>
      <div class="icon-label">Recycle Bin</div>
    </div>
  </div>

  <!-- Cửa sổ giả lập -->
  <div class="window win-bevel-out" id="appWindow">
    <div class="title-bar" id="windowHeader">
      <span id="windowTitle">My Computer</span>
      <div class="title-bar-controls">
        <button class="win-btn" onclick="minimizeWindow()">_</button>
        <button class="win-btn" onclick="toggleMaximize()">🗖</button>
        <button class="win-btn" onclick="closeWindow()">✕</button>
      </div>
    </div>
    <div class="window-menu">
      <span><u>F</u>ile</span>
      <span><u>E</u>dit</span>
      <span><u>V</u>iew</span>
      <span><u>H</u>elp</span>
    </div>
    <div class="window-body win-bevel-in" id="windowContent">
      <p><b>(C:) Ổ đĩa hệ thống</b></p>
      <p style="margin-top: 8px;">Windows 95 đã được khắc phục toàn bộ lỗi điều khiển và drag-and-drop.</p>
    </div>
  </div>

  <!-- Start Menu -->
  <div class="start-menu win-bevel-out" id="startMenu">
    <div class="menu-sidebar"><span>Windows</span>95</div>
    <ul class="menu-items">
      <li class="menu-item" onclick="openApp('Programs')">📁 <u>P</u>rograms</li>
      <li class="menu-item" onclick="openApp('Documents')">📄 <u>D</u>ocuments</li>
      <li class="menu-item" onclick="openApp('Settings')">⚙️ <u>S</u>ettings</li>
      <div class="menu-separator"></div>
      <li class="menu-item" onclick="alert('Bây giờ bạn có thể tắt máy an toàn.')">🔌 Sh<u>u</u>t Down...</li>
    </ul>
  </div>

  <!-- Taskbar -->
  <div class="taskbar win-bevel-out">
    <div class="taskbar-left">
      <div class="start-button win-bevel-out" id="startBtn" onclick="toggleStartMenu()">
        <span>🪟</span>
        <span>Start</span>
      </div>
      <div class="taskbar-divider"></div>
      <div class="taskbar-app-btn win-bevel-out" id="taskbarApp" onclick="toggleWindowFromTaskbar()">
        <span>💻</span>
        <span id="taskbarAppTitle">My Computer</span>
      </div>
    </div>

    <div class="system-tray win-bevel-in">
      <span style="font-size: 10px;">🔊</span>
      <span id="clock">12:00 PM</span>
    </div>
  </div>

  <script>
    // 1. Cập nhật đồng hồ hệ thống
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Xử lý Start Menu & đóng khi click ngoài
    const startBtn = document.getElementById('startBtn');
    const startMenu = document.getElementById('startMenu');

    function toggleStartMenu() {
      const isOpen = startMenu.classList.toggle('open');
      startBtn.classList.toggle('active', isOpen);
    }

    document.addEventListener('click', (e) => {
      if (!startBtn.contains(e.target) && !startMenu.contains(e.target)) {
        startMenu.classList.remove('open');
        startBtn.classList.remove('active');
      }
      // Bỏ chọn icon nếu click vào nền desktop
      if (e.target.id === 'desktop') {
        document.querySelectorAll('.icon').forEach(ic => ic.classList.remove('selected'));
      }
    });

    // 3. Highlight Icon khi click
    document.querySelectorAll('.icon').forEach(icon => {
      icon.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.icon').forEach(ic => ic.classList.remove('selected'));
        icon.classList.add('selected');
      });
    });

    // 4. Quản lý cửa sổ & Taskbar
    const appWindow = document.getElementById('appWindow');
    const taskbarApp = document.getElementById('taskbarApp');
    const windowTitle = document.getElementById('windowTitle');
    const taskbarAppTitle = document.getElementById('taskbarAppTitle');

    function openApp(name) {
      windowTitle.textContent = name;
      taskbarAppTitle.textContent = name;
      appWindow.classList.remove('hidden');
      taskbarApp.style.display = 'flex';
      taskbarApp.classList.add('active');
      startMenu.classList.remove('open');
      startBtn.classList.remove('active');
    }

    function closeWindow() {
      appWindow.classList.add('hidden');
      taskbarApp.style.display = 'none';
      taskbarApp.classList.remove('active');
    }

    function minimizeWindow() {
      appWindow.classList.add('hidden');
      taskbarApp.classList.remove('active');
    }

    function toggleMaximize() {
      appWindow.classList.toggle('maximized');
    }

    function toggleWindowFromTaskbar() {
      if (appWindow.classList.contains('hidden')) {
        appWindow.classList.remove('hidden');
        taskbarApp.classList.add('active');
      } else {
        appWindow.classList.add('hidden');
        taskbarApp.classList.remove('active');
      }
    }

    // Khởi tạo hiển thị cửa sổ ban đầu
    taskbarApp.style.display = 'flex';
    taskbarApp.classList.add('active');

    // 5. Kéo thả cửa sổ mượt mà (Window Dragging)
    const header = document.getElementById('windowHeader');
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    header.addEventListener('mousedown', (e) => {
      if (e.target.tagName.toLowerCase() === 'button' || appWindow.classList.contains('maximized')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      initialLeft = appWindow.offsetLeft;
      initialTop = appWindow.offsetTop;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      appWindow.style.left = `${initialLeft + dx}px`;
      appWindow.style.top = `${initialTop + dy}px`;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });
  </script>
</body>
</html>
