<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bất ngờ chưa!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* Nền đen để chữ nổi bật hẳn lên */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', Impact, sans-serif;
        }
        h1 {
            color: #FF0000; /* Màu đỏ rực tạo hiệu ứng giật mình */
            font-size: 8vw; /* Chữ tự động phóng to hết cỡ theo kích thước màn hình */
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 5px 5px 0px #FFFFFF; /* Đổ bóng màu trắng tạo hiệu ứng 3D */
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>BẠN BỊ LỪA RỒI!!</h1>

</body>
</html>
